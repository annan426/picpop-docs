<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PicPop 使用说明</title>
  <meta name="description" content="PicPop 使用说明" />
  <link rel="icon" href="logo.png" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fc;
      --bg-glow: rgba(76, 141, 255, .16);
      --text: #10151d;
      --muted: #6b7788;
      --line: rgba(16, 21, 29, .08);
      --accent: #2f6ff0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --bg-glow: rgba(76, 141, 255, .22);
        --text: #eef2f8;
        --muted: #8b97a8;
        --line: rgba(255, 255, 255, .08);
        --accent: #6aa2ff;
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 背景光晕：静态、极淡，只为让纯文字页面不显得空 */
    body::before {
      content: "";
      position: fixed;
      inset: -20% -10% auto -10%;
      height: 70vh;
      background: radial-gradient(ellipse at 50% 0%, var(--bg-glow), transparent 68%);
      pointer-events: none;
    }

    main {
      position: relative;
      text-align: center;
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 26px;
      display: block;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(47, 111, 240, .18);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5.2vw, 46px);
      font-weight: 600;
      letter-spacing: .02em;
      line-height: 1.3;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="logo.png" alt="PicPop" width="64" height="64" />
    <h1>PicPop 使用说明</h1>
  </main>
</body>
</html>
